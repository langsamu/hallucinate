# OpenTelemetry Collector configuration for hello.bas observability
#
# Receives OTLP signals (traces, metrics, logs) from the BASIC emulator over
# HTTP on port 4318, then exports them two ways:
#
#   debug        - prints every signal in human-readable detail to the
#                  collector's own stdout so CI can capture it with
#                  "docker logs".
#
#   file/traces  - writes OTLP JSON trace records to /tmp/otel-traces.json
#                  (importable into Jaeger via File > Import Trace).
#
#   file/metrics - writes OTLP JSON metric records to /tmp/otel-metrics.json.
#
#   file/logs    - writes OTLP JSON log records to /tmp/otel-logs.json.
#
# Each signal type gets its own file so the CI "Upload OTel signals" step can
# attach them as separate named artifacts, making it easy to download just
# the traces and drop them into Jaeger for analysis.
#
# NOTE: No batch processor is used. Signals are exported immediately as they
# arrive so that the file exporter writes its output before CI copies the
# files with "docker cp". A batch processor would delay writes until its
# timeout fires, causing "file not found" errors when CI copies immediately
# after the test run ends.

receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"

exporters:
  debug:
    verbosity: detailed

  file/traces:
    path: /tmp/otel-traces.json
    rotation:
      max_megabytes: 10

  file/metrics:
    path: /tmp/otel-metrics.json
    rotation:
      max_megabytes: 10

  file/logs:
    path: /tmp/otel-logs.json
    rotation:
      max_megabytes: 10

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      exporters: [debug, file/logs]
