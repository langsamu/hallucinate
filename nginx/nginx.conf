# nginx/nginx.conf — TLS termination for the coordinator.
#
# Terminates HTTPS on :8443 and proxies plain HTTP to the coordinator
# on :8080.  This keeps TLS entirely at the infrastructure level;
# the BASIC programs communicate over plain HTTP internally.
#
# Generate a self-signed certificate for local/CI use:
#   mkdir -p nginx/certs
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout nginx/certs/tls.key -out nginx/certs/tls.crt \
#     -subj "/CN=localhost"

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://coordinator:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Forward W3C trace-context headers for distributed tracing.
        proxy_set_header traceparent  $http_traceparent;
        proxy_set_header tracestate   $http_tracestate;
    }
}
