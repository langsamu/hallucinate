name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start OpenTelemetry Collector
        # GitHub Actions service container volumes cannot bind-mount individual
        # files (only directories), so we start the collector as a regular step
        # using `docker run` where per-file mounts work correctly.
        run: |
          docker run --rm -d \
            --name otel-collector \
            -p 4318:4318 \
            -v "${{ github.workspace }}/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml" \
            otel/opentelemetry-collector-contrib:0.100.0
          # Wait up to 30 seconds for the collector's health endpoint to respond.
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:13133 2>/dev/null; then
              echo "OTel Collector is ready"
              break
            fi
            sleep 1
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
        run: python run_tests.py

      - name: Visualize OpenTelemetry signals
        if: always()
        run: |
          echo "=========================================="
          echo "OPENTELEMETRY COLLECTOR SIGNAL OUTPUT:"
          echo "=========================================="
          docker logs otel-collector 2>&1 | grep -E "(LogRecord|Span|Metric|hello|HELLO|iteration|RECOVERED)" | head -100 || true

      - name: Collect OTel signal files from container
        if: always()
        run: |
          # Give the file exporter a moment to finish writing any in-flight
          # records before we copy them out. Even without a batch processor
          # the exporter may buffer a final write.
          sleep 2
          # Copy the OTLP JSON signal files out of the collector container
          # so they can be uploaded as CI artifacts for Jaeger import.
          # Each file is in OTLP JSON (line-delimited) format:
          #   otel-traces.json  — import into Jaeger via Search > JSON File
          #   otel-metrics.json — OpenTelemetry metrics data
          #   otel-logs.json    — OpenTelemetry log records
          mkdir -p otel-signals
          docker cp otel-collector:/tmp/otel-traces.json  otel-signals/otel-traces.json  2>/dev/null || echo "otel-traces.json not found (no traces emitted)"
          docker cp otel-collector:/tmp/otel-metrics.json otel-signals/otel-metrics.json 2>/dev/null || echo "otel-metrics.json not found (no metrics emitted)"
          docker cp otel-collector:/tmp/otel-logs.json    otel-signals/otel-logs.json    2>/dev/null || echo "otel-logs.json not found (no logs emitted)"
          docker stop otel-collector 2>/dev/null || true
          ls -lh otel-signals/ || true

      - name: Upload OTel signals as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-signals
          path: otel-signals/
          if-no-files-found: warn
          retention-days: 30
