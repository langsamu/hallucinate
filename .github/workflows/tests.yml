name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write       # needed to commit the Jaeger screenshot to the branch
  pull-requests: write  # needed to post the screenshot as a PR comment

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Jaeger
        # Jaeger all-in-one accepts OTLP gRPC on its internal port 4317.
        # We map that to HOST port 4316 to avoid collision with the OTel
        # Collector, which already owns host port 4317.  The Jaeger UI is
        # available at http://localhost:16686.
        run: |
          docker run -d \
            --name jaeger \
            -p 16686:16686 \
            -p 4316:4317 \
            jaegertracing/all-in-one:1.57
          echo "Waiting for Jaeger UI on port 16686..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:16686/ > /dev/null 2>&1; then
              echo "Jaeger is ready"
              break
            fi
            sleep 1
          done

      - name: Start OpenTelemetry Collector
        # GitHub Actions service container volumes cannot bind-mount individual
        # files (only directories), so we start the collector as a regular step
        # using `docker run` where per-file and per-directory mounts work correctly.
        # We mount the otel-signals/ directory from the host into /signals/ inside
        # the container, so the file exporter writes directly to the host — no
        # docker cp step required.
        run: |
          mkdir -p otel-signals
          # The otelcol user inside the container (UID 10001) must be able to write
          # to the /signals mount, which is owned by the runner user on the host.
          # Make the directory world-writable so the container user can create files.
          chmod 777 otel-signals
          docker run -d \
            --name otel-collector \
            --network host \
            -v "${{ github.workspace }}/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml" \
            -v "${{ github.workspace }}/otel-signals:/signals" \
            otel/opentelemetry-collector-contrib:0.100.0
          # Wait up to 30 seconds for the OTLP HTTP port (4318) to be ready.
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:4318 2>&1 | grep -q "404 page not found"; then
              echo "OTel Collector is ready on port 4318"
              break
            fi
            sleep 1
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
        run: python run_tests.py

      - name: Visualize OpenTelemetry signals
        if: always()
        run: |
          echo "=========================================="
          echo "OPENTELEMETRY COLLECTOR SIGNAL OUTPUT:"
          echo "=========================================="
          docker logs otel-collector 2>&1 | grep -E "(LogRecord|Span|Metric|hello|HELLO|iteration|RECOVERED)" | head -100 || true
          echo "=========================================="
          echo "OPENTELEMETRY COLLECTOR FULL LOGS (last 50 lines):"
          echo "=========================================="
          docker logs otel-collector 2>&1 | tail -50 || true

      - name: Screenshot Jaeger trace and post as PR comment
        # Take a headless-browser screenshot of the Jaeger UI showing the
        # hello-world trace with nested spans.  The screenshot is saved to
        # screenshots/jaeger-trace.png, then uploaded to the PR branch and
        # posted as an embedded-image PR comment via the GitHub API.
        #
        # The posting is done entirely in Python (screenshot_jaeger.py) to
        # avoid the shell ARG_MAX limit that breaks `gh api -F content=<b64>`
        # when the PNG exceeds ~128 KB.
        #
        # Failures here are non-fatal — tests already passed above.
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install playwright requests
          playwright install chromium --with-deps
          python screenshot_jaeger.py

      - name: Stop OTel Collector and Jaeger, list signal files
        if: always()
        run: |
          docker stop otel-collector 2>/dev/null || true
          docker rm   otel-collector 2>/dev/null || true
          docker stop jaeger 2>/dev/null || true
          docker rm   jaeger 2>/dev/null || true
          # Signal files are written directly to otel-signals/ on the host
          # (mounted into the container as /signals/) — no docker cp needed.
          ls -lh otel-signals/ || true

      - name: Upload OTel signals as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentelemetry-signals
          path: otel-signals/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Jaeger screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaeger-trace-screenshot
          path: screenshots/jaeger-trace.png
          if-no-files-found: warn
          retention-days: 30

